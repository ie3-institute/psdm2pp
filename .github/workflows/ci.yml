name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      #----------------------------------------------
      #       check-out repo and set-up python
      #----------------------------------------------
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      #----------------------------------------------
      #        load pip cache if cache exists
      #----------------------------------------------
      - uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip
          restore-keys: ${{ runner.os }}-pip
      #----------------------------------------------
      #          install and run linters
      #----------------------------------------------
      - run: python -m pip install black flake8 isort
      - run: |
          flake8 . --count --show-source --statistics
          black . --check
          isort .

  test:
    needs: linting
    strategy:
      fail-fast: true
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        python-version: ['3.11']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      #----------------------------------------------
      #       check-out repo and set-up python
      #----------------------------------------------
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install PostgreSQL Development Tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - name: Install PostgreSQL (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install postgresql

      - name: Init PostgreSQL (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          echo "Searching for PostgreSQL installation..."
          CANDIDATES=(
            "/c/Program Files/PostgreSQL/16/bin"
            "/c/Program Files/PostgreSQL/15/bin"
            "/c/Program Files/PostgreSQL/14/bin"
            "/c/Program Files/PostgreSQL/13/bin"
          )
          
          FOUND=""
          
          for path in "${CANDIDATES[@]}"; do
            if [ -x "$path/psql.exe" ]; then
              FOUND="$path"
              break
            fi
          done
          
          if [ -n "$FOUND" ]; then
            echo "PostgreSQL binaries found at: $FOUND"
            echo "PGBIN=$FOUND" >> "$GITHUB_ENV"
            echo "PSQL=$FOUND/psql.exe" >> "$GITHUB_ENV"
            "$FOUND/psql.exe" --version
          else
            echo "No PostgreSQL installation found on this runner."
            echo "PGBIN=" >> "$GITHUB_ENV"
          fi

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      #----------------------------------------------
      #       load cached venv if cache exists
      #----------------------------------------------
      - name: Cache Venv
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: .venv
          key: poetry-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-
      #----------------------------------------------
      # install dependencies if cache does not exist
      #----------------------------------------------
      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Run tests (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          source .venv/bin/activate
          pytest tests/

      - name: Run tests (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          source .venv/bin/activate
          pytest tests/

      - name: Run tests (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          source .venv/Scripts/activate
          pytest tests/
